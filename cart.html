<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик - Sheeses</title>
    <link rel="stylesheet" href="cart.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
</head>
<body>
    <header>
        <div class="logo">
            <img src="/img/logo-removebg-preview (1).png" alt="logo">
        </div>
        
        <button class="menu-toggle" aria-label="Відкрити меню">☰</button>
        
        <nav class="menu">
            <a href="index.html">
                <div class="all"><button>На головну</button></div>
            </a>
            <a href="more-products.html">
                <div class="more-products"><button>Переглянути все</button></div>
            </a>
            <a href="cart.html">
                <div class="login"><button id="cart-button">кошик <span id="cart-count">0</span></button></div>
            </a>
        </nav>
    </header>

    <div class="cart-container">
        <h1>Ваш кошик</h1>
        <div id="cart-items">
            <!-- Товари будуть додаватись тут -->
        </div>

        <div class="cart-summary">
            <h3>Разом: <span id="total-price">0</span> ₴</h3>
        </div>

        <div class="order-form">
            <h2>Оформлення замовлення</h2>
            <form id="order-form">
                <label for="name">Ім'я:</label>
                <input type="text" id="name" name="name" required>

                <label for="phone">Номер телефону:</label>
                <input type="tel" id="phone" name="phone" required>

                <label for="email">Email:</label>
                <input type="email" id="email" name="email" required>

                <label for="address">Адреса доставки:</label>
                <textarea id="address" name="address" rows="3" required></textarea>

                <label for="comments">Коментар до замовлення:</label>
                <textarea id="comments" name="comments" rows="2"></textarea>

                <button type="submit">Оформити замовлення</button>
            </form>
        </div>
    </div>

    <script src="cart.js"></script>
</body>
</html>
