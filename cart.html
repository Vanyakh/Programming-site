<!DOCTYPE html>
<html lang="uk">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Кошик - Sheeses</title>
    <!-- Bootstrap CSS -->
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <!-- Font Awesome -->
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <!-- Custom CSS -->
    <link rel="stylesheet" href="style.css">
</head>
<body>
    <!-- Header with Bootstrap Navbar -->
    <header class="sticky-top">
        <nav class="navbar navbar-expand-lg navbar-light bg-light">
            <div class="container">
                <a class="navbar-brand" href="index.html">
                    <img src="/img/logo-removebg-preview (1).png" alt="Sheeses Logo" height="60">
                </a>
                <button class="navbar-toggler" type="button" data-bs-toggle="collapse" data-bs-target="#navbarNav" 
                        aria-controls="navbarNav" aria-expanded="false" aria-label="Toggle navigation">
                    <span class="navbar-toggler-icon"></span>
                </button>
                <div class="collapse navbar-collapse" id="navbarNav">
                    <ul class="navbar-nav ms-auto">
                        <li class="nav-item">
                            <a class="nav-link" href="index.html">На головну</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link" href="more-products.html">Переглянути все</a>
                        </li>
                        <li class="nav-item">
                            <a class="nav-link active" href="cart.html">
                                Кошик <span id="cart-count" class="badge bg-primary">0</span>
                            </a>
                        </li>
                    </ul>
                </div>
            </div>
        </nav>
    </header>

    <!-- Cart Section -->
    <section class="cart-section py-5">
        <div class="container">
            <h1 class="mb-5">Ваш кошик</h1>
            
            <div class="row">
                <div class="col-lg-8 mb-4 mb-lg-0">
                    <div id="cart-items" class="bg-white p-4 rounded shadow-sm">
                        <!-- Cart items will be added here dynamically -->
                        <div class="text-center py-5">
                            <p class="text-muted">Ваш кошик порожній</p>
                            <a href="more-products.html" class="btn btn-primary">Продовжити покупки</a>
                        </div>
                    </div>
                </div>
                
                <div class="col-lg-4">
                    <div class="bg-white p-4 rounded shadow-sm sticky-top" style="top: 100px;">
                        <h3 class="mb-4">Разом: <span id="total-price">0</span> ₴</h3>
                        
                        <div class="order-form">
                            <h4 class="mb-4">Оформлення замовлення</h4>
                            <form id="order-form">
                                <div class="mb-3">
                                    <label for="name" class="form-label">Ім'я:</label>
                                    <input type="text" class="form-control" id="name" name="name" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="phone" class="form-label">Номер телефону:</label>
                                    <input type="tel" class="form-control" id="phone" name="phone" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="email" class="form-label">Email:</label>
                                    <input type="email" class="form-control" id="email" name="email" required>
                                </div>
                                
                                <div class="mb-3">
                                    <label for="address" class="form-label">Адреса доставки:</label>
                                    <textarea class="form-control" id="address" name="address" rows="3" required></textarea>
                                </div>
                                
                                <div class="mb-4">
                                    <label for="comments" class="form-label">Коментар до замовлення:</label>
                                    <textarea class="form-control" id="comments" name="comments" rows="2"></textarea>
                                </div>
                                
                                <button type="submit" class="btn btn-primary w-100">Оформити замовлення</button>
                            </form>
                        </div>
                    </div>
                </div>
            </div>
        </div>
    </section>

    <!-- Footer -->
    <footer class="bg-dark text-white py-4">
        <div class="container">
            <div class="row">
                <div class="col-md-6 mb-3 mb-md-0">
                    <h5>Контакти</h5>
                    <p>Телефон: +380 123 456 789</p>
                </div>
                <div class="col-md-6 text-md-end">
                    <h5>Соціальні мережі</h5>
                    <a href="https://www.instagram.com" target="_blank" class="text-white me-3"><i class="fab fa-instagram fa-lg"></i></a>
                    <a href="https://telegram.org" target="_blank" class="text-white me-3"><i class="fab fa-telegram fa-lg"></i></a>
                    <a href="https://facebook.com" target="_blank" class="text-white me-3"><i class="fab fa-facebook fa-lg"></i></a>
                    <a href="https://tiktok.com" target="_blank" class="text-white"><i class="fab fa-tiktok fa-lg"></i></a>
                </div>
            </div>
        </div>
    </footer>

    <!-- Bootstrap JS Bundle with Popper -->
    <script src="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/js/bootstrap.bundle.min.js"></script>
    <!-- Custom JS -->
    <script src="cart.js"></script>
</body>
</html>
